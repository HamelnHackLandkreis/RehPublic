  # Master-Server verwaltet die Volume-Server und das Dateisystem-Layout
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=seaweed-master"
    networks:
      - wildkamera-net

  # Der Volume-Server speichert die tatsächlichen Bilder/Videos
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8080:8080"
      - "18080:18080"
    command: "volume -mserver=seaweed-master:9333 -port=8080"
    depends_on:
      - seaweed-master
    networks:
      - wildkamera-net
    volumes:
      - seaweed_data:/data

  # Der Filer bietet eine Dateisystem-Abstraktion und ist die Basis für S3
  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8888:8888"
      - "18888:18888"
    command: "filer -master=seaweed-master:9333"
    depends_on:
      - seaweed-master
      - seaweed-volume
    networks:
      - wildkamera-net

  # Das S3-Interface ermöglicht euch die Nutzung von Standard S3-Clients (Boto3, etc.)
  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"
    # Wir starten den S3-Service und verbinden ihn mit dem Filer
    command: 's3 -filer="seaweed-filer:8888" -ip.bind=0.0.0.0'
    depends_on:
      - seaweed-filer
    networks:
      - wildkamera-net

networks:
  wildkamera-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
